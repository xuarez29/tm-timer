<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Cronómetro Toastmasters">
  <!-- Navy ground, rounded like a platform app icon.
       Palette and clock geometry match the "Cronómetro" wordmark on the home
       screen, where the final "o" is drawn as this same clock face. -->
  <rect width="512" height="512" rx="112" fill="#08192A"/>

  <!-- Clock face -->
  <g fill="none" stroke="#F2C14E" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="256" r="168"/>
    <!-- Minute hand up, hour hand to the lower right -->
    <polyline points="256,149 256,256 331,299"/>
  </g>
</svg>
